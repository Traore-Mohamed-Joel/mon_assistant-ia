[project]
name = "formation-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joel traore", email = "mohamedjoeltraore@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "jinja2>=3.1.6",
    "mistralai>=3.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
formation-ia = "formation_ia:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
